<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Avatar</h1>
      <img
        src="https://i.imgur.com/TrS9t2r.png"
        alt="Foto de perfil"
        class="avatar"
        width="100"
        height="100" />
    </main>
  </body>
</html>

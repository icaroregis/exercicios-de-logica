<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Tim Berners-Lee | Wiki</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui;
      }

      ul li {
        line-height: 1.7;
      }

      .link-de-recurso {
        transition:
          background-color 200ms,
          color 200ms;
        color: #3204ac;
        padding: 5px 10px;
        border-radius: 3px;
      }

      .link-de-recurso:active {
        background-color: #44ff88;
        color: black;
      }

      .link-de-recurso:hover {
        background-color: #3204ac;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <ul>
        <li>
          <a
            class="link-de-recurso"
            href="https://en.wikipedia.org/wiki/Tim_Berners-Lee"
            target="_blank"
            >WikiPedia</a
          >
        </li>
        <li>
          <a
            class="link-de-recurso"
            href="https://www.ted.com/speakers/tim_berners_lee"
            target="_blank"
            >Ted</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
